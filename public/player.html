<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multi-view · Imou Streamer</title>
  <link rel="stylesheet" href="/imou-player.css" />
  <link rel="stylesheet" href="/styles.css" />
  <script type="module" src="/imou-player.js"></script>
  <script type="module" src="/pages/player.js"></script>
</head>
<body>
  <header class="top">
    <h1>Imou Streamer</h1>
    <nav>
      <a href="/">Cameras</a>
      <a href="/player.html" class="active">Multi-view</a>
      <a href="/settings.html">Accounts</a>
    </nav>
  </header>
  <main>
    <section class="card">
      <h2>Multi-camera view</h2>
      <p class="muted-note">
        Pin cameras from the Cameras page ("Multi-view"), or hit
        <strong>Play all in multi-view</strong> there to load every channel at once.
        Each cell uses that camera's own saved password. Up to 9 streams; more cells
        means more CPU.
      </p>
      <div class="row toolbar">
        <button id="play-all">Play all</button>
        <button id="pause-all" class="ghost">Pause all</button>
        <button id="destroy-all" class="danger">Destroy all</button>
        <label style="flex:0 0 160px">Layout
          <select id="layout">
            <option value="1">1-up</option>
            <option value="2">2-up</option>
            <option value="3">3-up</option>
            <option value="4" selected>4-up (2×2)</option>
            <option value="6">6-up (2×3)</option>
            <option value="9">9-up (3×3)</option>
          </select>
        </label>
        <span class="spacer"></span>
        <a href="/" class="muted-note">← Back to cameras</a>
      </div>
    </section>
    <div id="status"></div>
    <div id="grid" class="player-grid"></div>
  </main>
</body>
</html>
